version: "3.8"

services:
  postgres:
    image: ankane/pgvector:v0.7.4-pg16
    container_name: campuseats-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: campuseats_db
      POSTGRES_USER: campuseats
      POSTGRES_PASSWORD: campuseats_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuseats -d campuseats_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: campuseats-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: campuseats-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      NEO4J_AUTH: neo4j/campuseats_neo4j
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "campuseats_neo4j", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
    name: campuseats_postgres_data
  redis_data:
    name: campuseats_redis_data
  neo4j_data:
    name: campuseats_neo4j_data
  neo4j_logs:
    name: campuseats_neo4j_logs
